name: Deploy Cloud Function

# Auto-deploys the coach-note backend (functions/askAI) whenever functions/** changes on
# main, and can be run on demand from the Actions tab.
#
# Auth uses a FIREBASE_TOKEN repo secret (from `firebase login:ci`), same as the
# byrnes-finance repo — it deploys as the owner, so it can enable the required Google
# APIs and deploy functions without extra service-account IAM setup. (The reminder job's
# FIREBASE_SERVICE_ACCOUNT is scoped to Firestore/FCM only and can't deploy functions.)
#
# The Gemini key (AI_API_KEY) is a Cloud Functions secret set once in the project
# (firebase functions:secrets:set AI_API_KEY) — it is NOT needed here.

on:
  push:
    branches: [main]
    paths:
      - 'functions/**'
  workflow_dispatch: {}

permissions:
  contents: read

# If several deploys are queued, cancel older ones so the newest code wins.
concurrency:
  group: deploy-functions
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install function dependencies
        run: npm install
        working-directory: functions

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Deploy functions
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: firebase deploy --only functions --project murph-tracker-c94db --non-interactive --force --token "$FIREBASE_TOKEN"
