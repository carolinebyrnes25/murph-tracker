name: Workout reminders

on:
  schedule:
    - cron: '*/30 * * * *'   # every 30 min (GitHub cron is best-effort; sender is catch-up based so late runs still deliver)
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run: log who would be notified without sending'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        working-directory: reminder-sender
        run: npm install --no-audit --no-fund
      - name: Send due reminders
        working-directory: reminder-sender
        run: node send.js
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}
